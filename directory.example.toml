# albo instance configuration.
#
# One albo process serves one directory. Everything that makes an instance
# *this* directory (rather than any other) lives here; the engine itself is
# generic. Copy to directory.toml and edit.

[directory]
# Site name shown in the header and title. This is the instance's brand -
# e.g. customer #1 runs as "Meat Ledger".
name = "Meat Ledger"
# What one entry is called, singular and plural. Shown in the UI:
# "Add tattooer", "12 tattooers".
entity = "tattooer"
entities = "tattooers"
# City / scope line shown under the name.
tagline = "Portland tattooers, curated"
# Public base URL (no trailing slash). Enables absolute Open Graph / social
# card links, so shared pages render a rich preview. Leave empty to omit the
# og:url and og:image tags (title and description still render).
base_url = "https://albo.example.com"

[tags]
# The tag taxonomy admins can assign to entries. Order is display order.
available = [
  "traditional",
  "fine line",
  "blackwork",
  "color",
  "realism",
  "flash",
]

[server]
bind = "127.0.0.1:3010"
# SQLite database path, relative to the working directory.
database = "albo.db"

# Admin accounts are NOT configured here - they live in the database.
# Create the first one with:  albo admin-add <username>
# (it prompts for a password). Manage with admin-list / admin-remove.
