<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <style>
    /* Light theme (default). Every color is a variable so a theme is just
       a new set of these. */
    :root {
      --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --line: #ddd;
      --accent: #b3261e; --accent-fg: #fff;
      --quiet-bg: #eee; --notice-bg: #fff8e1; --notice-line: #eecf70;
    }
    /* Dark theme: applied when the OS asks for it, unless the visitor has
       explicitly chosen light (data-theme="light" wins via the block below). */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #15161a; --fg: #e6e6e6; --muted: #9aa0a6; --line: #34363c;
        --accent: #ff6b61; --accent-fg: #15161a;
        --quiet-bg: #26272c; --notice-bg: #3a2f16; --notice-line: #6b5a2a;
      }
    }
    /* Explicit override: data-theme on <html> forces a theme regardless of OS. */
    :root[data-theme="dark"] {
      --bg: #15161a; --fg: #e6e6e6; --muted: #9aa0a6; --line: #34363c;
      --accent: #ff6b61; --accent-fg: #15161a;
      --quiet-bg: #26272c; --notice-bg: #3a2f16; --notice-line: #6b5a2a;
    }

    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; color: var(--fg);
           background: var(--bg); margin: 0; }
    header { border-bottom: 1px solid var(--line); padding: 1rem 1.5rem;
             display: flex; justify-content: space-between; align-items: flex-start; }
    header h1 { margin: 0; font-size: 1.4rem; }
    header p { margin: .2rem 0 0; color: var(--muted); font-size: .9rem; }
    main { max-width: 60rem; margin: 0 auto; padding: 1.5rem; }
    a { color: var(--accent); }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); }
    input[type=text], input[type=password], input[type=url], textarea {
      width: 100%; padding: .5rem; border: 1px solid var(--line); border-radius: 4px;
      font: inherit; background: var(--bg); color: var(--fg);
    }
    label { display: block; margin: .8rem 0 .2rem; font-weight: 600; font-size: .9rem; }
    button { padding: .5rem 1rem; border: 0; border-radius: 4px; background: var(--accent);
             color: var(--accent-fg); font: inherit; cursor: pointer; }
    button.quiet { background: var(--quiet-bg); color: var(--fg); }
    .row-form { display: inline; }
    .notice { background: var(--notice-bg); border: 1px solid var(--notice-line);
              padding: .6rem .8rem; border-radius: 4px; margin-bottom: 1rem; }
    /* Theme toggle: a bare button, no accent fill. */
    #theme-toggle { background: none; color: var(--muted); padding: .3rem .5rem;
                    font-size: 1.1rem; line-height: 1; }
    .view-btn { margin-right: .4rem; }
    /* Header nav: login/admin links sit next to the theme toggle. */
    .header-nav { display: flex; align-items: center; gap: .8rem; font-size: .9rem; }
    /* A button that reads as a link (used for logout, which must POST). */
    .linklike { background: none; color: var(--accent); padding: 0; font: inherit;
                cursor: pointer; }
  </style>
  <script>
    // Apply the saved theme before first paint to avoid a flash of the
    // light default. Runs in <head>, synchronously, so the attribute is set
    // on <html> before the body renders. The toggle wiring lives at the end
    // of <body> where the button exists.
    (function () {
      var saved = localStorage.getItem("albo-theme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <div>
      <h1><a href="/" style="color:inherit; text-decoration:none">{{ site_name }}</a></h1>
      <p>{{ tagline }}</p>
    </div>
    <nav class="header-nav">
      {% if authed %}
        <a href="/admin">Admin</a>
        <form class="row-form" method="post" action="/admin/logout"><button class="linklike" type="submit">Log out</button></form>
      {% else %}
        <a href="/admin/login">Log in</a>
      {% endif %}
      <button id="theme-toggle" type="button" title="Toggle light/dark" aria-label="Toggle light/dark">◐</button>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Wire up the theme toggle. The saved theme was already applied in
    // <head> (see above) to avoid a flash; this only handles clicks.
    (function () {
      var btn = document.getElementById("theme-toggle");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var root = document.documentElement;
        // Resolve the currently-shown theme (explicit attr, else OS).
        var current = root.getAttribute("data-theme");
        if (!current) {
          current = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        var next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("albo-theme", next);
      });
    })();
  </script>
</body>
</html>
